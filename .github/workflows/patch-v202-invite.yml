name: Patch v2.0.2 Invite Registration

on:
  push:
    branches:
      - feature/v2-invite-register-jy888

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2-invite-register-jy888
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply invite registration patch
        run: node scripts/patch-v202-invite.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MirrorV2Experience.tsx src/mirrorV2Api.ts public/install/VERSION public/sw.js
          git commit -m "feat: switch registration to JY888 recommendation code"
          git push origin HEAD:feature/v2-invite-register-jy888
