name: Android Boot Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build:pwa
      - name: Sync Android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is unavailable on this runner"
          fi
      - name: Boot app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            adb wait-for-device
            until adb shell cmd package list packages >/dev/null 2>&1; do sleep 2; done
            adb install --no-streaming -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.mirrorisle.beta >/dev/null
            adb logcat -c
            adb shell am start -W -n com.mirrorisle.beta/.MainActivity | tee mirror-start.txt
            grep -q 'Status: ok' mirror-start.txt
            sleep 2
            adb shell pidof com.mirrorisle.beta | grep -Eq '[0-9]+'
            adb logcat -d -t 800 > mirror-logcat.txt
            if grep -E 'FATAL EXCEPTION.*com\.mirrorisle\.beta|Process: com\.mirrorisle\.beta.*FATAL' mirror-logcat.txt; then cat mirror-logcat.txt; exit 1; fi
            grep -q 'MIRROR_BOOT_READY' mirror-logcat.txt
            grep -E 'MIRROR_BOOT_READY|Capacitor|com\.mirrorisle\.beta|chromium' mirror-logcat.txt | tail -120 || true
            echo "Mirror Isle Android activity, WebView JavaScript bundle, and App module all booted successfully."
