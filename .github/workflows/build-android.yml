name: Build Android APK

on:
  push:
    branches:
      - main
      - rewrite/mirror-isle-clean-v1
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build:pwa
      - name: Sync Android
        run: npx cap sync android
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME}"; else VERSION="$(tr -d '\r\n ' < public/install/VERSION)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "mirror-isle-${{ steps.version.outputs.version }}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror-isle-clean-apk
          path: mirror-isle-*.apk
      - name: Publish or update public release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSET="mirror-isle-${VERSION}.apk"
          NOTES="镜屿 v2.1.0-beta：按理想稿完成全局 UI/UX 精修，重新校准字体、卡片、留白与 Android 状态栏/多尺寸屏幕适配；将本轮原创生成的湖畔、书写、阅读、海岸与漂流瓶治愈场景真正嵌入遇见、记录、消息、成长和我的页面；记录页升级为‘心情打卡 / 树洞 / 世界’三个并列可点击入口，并继续使用原有 Supabase 联机数据与真实功能。"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ASSET" --clobber --repo "${{ github.repository }}"
            gh release edit "$VERSION" --repo "${{ github.repository }}" --title "镜屿 ${VERSION}" --notes "$NOTES"
          else
            gh release create "$VERSION" "$ASSET" --target "${GITHUB_SHA}" --repo "${{ github.repository }}" --title "镜屿 ${VERSION}" --notes "$NOTES"
          fi
