name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/mood-treehole-bottles-v013
      - feature/realtime-drift-wallet-forest-v014
      - feature/market-ready-auth-mobile-ios-v015
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:pwa

      - name: Sync Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare release APK
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "mirror-isle-beta-${SAFE_REF}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirror-isle-beta-apk
          path: mirror-isle-beta-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "mirror-isle-beta-${{ github.ref_name }}.apk" \
            --repo "${{ github.repository }}" \
            --title "镜屿 ${{ github.ref_name }}" \
            --notes "邀请码免验证注册、真实手机端导航、漂流海与账户同步、安装站和 iOS 工程准备版本。"
