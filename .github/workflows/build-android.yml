name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/mood-treehole-bottles-v013
      - feature/realtime-drift-wallet-forest-v014
      - feature/market-ready-auth-mobile-ios-v015
      - feature/warm-psychometric-online-v016
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:pwa

      - name: Sync Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(tr -d '\r\n ' < public/install/VERSION)"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "mirror-isle-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror-isle-beta-apk
          path: mirror-isle-*.apk

      - name: Publish or update public release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSET="mirror-isle-${VERSION}.apk"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ASSET" --clobber --repo "${{ github.repository }}"
            gh release edit "$VERSION" --repo "${{ github.repository }}" \
              --title "镜屿 ${VERSION}" \
              --notes "温馨场景化人格测评、全账号同步心情/树洞/漂流海/回信、手机端安全区优化、邀请码免邮箱验证注册与 iOS 工程。"
          else
            gh release create "$VERSION" "$ASSET" \
              --target "${GITHUB_SHA}" \
              --repo "${{ github.repository }}" \
              --title "镜屿 ${VERSION}" \
              --notes "温馨场景化人格测评、全账号同步心情/树洞/漂流海/回信、手机端安全区优化、邀请码免邮箱验证注册与 iOS 工程。"
          fi
