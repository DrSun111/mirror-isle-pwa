name: Test v2.0.3 Invite Registration

on:
  push:
    branches:
      - fix/v2.0.3-invite-auth-hero

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Reject invalid code
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl -sS -w '\n%{http_code}' -X POST "$SUPABASE_URL/functions/v1/invite-register" -H 'Content-Type: application/json' -H "apikey: $SUPABASE_KEY" --data '{"email":"v203-invalid@example.com","password":"abc123","invite_code":"BADCODE"}')
          CODE=$(echo "$BODY" | tail -n1)
          JSON=$(echo "$BODY" | sed '$d')
          test "$CODE" = "403"
          echo "$JSON" | grep -q 'invalid_invite_code'
      - name: Register and login with JY888
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="mirror-v203-${GITHUB_RUN_ID}@example.com"
          PASSWORD='abc123'
          REGISTER=$(curl -fsS -X POST "$SUPABASE_URL/functions/v1/invite-register" -H 'Content-Type: application/json' -H "apikey: $SUPABASE_KEY" --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"invite_code\":\"JY888\"}")
          echo "$REGISTER" | grep -q '"ok":true'
          LOGIN=$(curl -fsS -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H 'Content-Type: application/json' -H "apikey: $SUPABASE_KEY" --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          echo "$LOGIN" | grep -q 'access_token'
          echo "registered_email=$EMAIL" >> "$GITHUB_STEP_SUMMARY"
