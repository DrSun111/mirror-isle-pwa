name: Patch v2.0.1 Auth

on:
  push:
    branches:
      - fix/v2-fresh-auth-illustration

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2-fresh-auth-illustration
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-v201-auth.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MirrorV2Experience.tsx src/mirror-v2.css
          git commit -m "fix: fresh auth rules and original illustration"
          git push origin HEAD:fix/v2-fresh-auth-illustration
