name: Normalize Mirror V2 Source

on:
  push:
    branches:
      - feature/mirror-v2-online

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/mirror-v2-online
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize source
        run: node scripts/normalize-mirror-v2-source.mjs
      - name: Commit normalized source
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MirrorV2Experience.tsx src/mirrorV2Api.ts
          git commit -m "fix: normalize v2 feed filtering and match cards"
          git push origin HEAD:feature/mirror-v2-online
