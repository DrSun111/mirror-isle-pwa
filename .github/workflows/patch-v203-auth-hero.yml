name: Patch v2.0.3 Auth Hero

on:
  push:
    branches:
      - fix/v2.0.3-invite-auth-hero

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.0.3-invite-auth-hero
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v2.0.3 patch
        run: node scripts/patch-v203-auth-hero.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MirrorV2Experience.tsx src/mirror-v2.css public/install/VERSION public/sw.js android/app/build.gradle
          git commit -m "fix: enforce invite registration and use generated auth artwork"
          git push origin HEAD:fix/v2.0.3-invite-auth-hero
