<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="镜屿是一款心理成长型深度关系产品，支持注册、初见心谱、每日有限推荐、关系图谱、看见、成长内容和 PWA 下载式使用。"
    />
    <meta name="theme-color" content="#f8efe7" />
    <meta property="og:title" content="镜屿 - 找到真正理解你的人" />
    <meta property="og:description" content="心理成长型深度关系产品：心谱、推荐、关系图谱、看见与共同成长。" />
    <meta property="og:image" content="%BASE_URL%og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>镜屿 - 找到真正理解你的人</title>
    <style>
      #mirror-preboot{min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#fffaf4,#f8efe7 70%,#eef4ed);color:#4b4038;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      #mirror-preboot .box{width:min(100%,420px);text-align:center}
      #mirror-preboot h1{margin:0 0 10px;font-family:"Songti SC",serif;font-size:34px}
      #mirror-preboot p{margin:0;color:#82756c;line-height:1.75;font-size:14px}
      #mirror-preboot button{display:none;margin:20px auto 0;min-height:48px;padding:0 22px;border:0;border-radius:14px;background:#c98066;color:#fff;font-weight:700;font-size:15px}
      #mirror-preboot.failed button{display:block}
    </style>
    <script>
      (function(){
        var failTimer=window.setTimeout(function(){
          if(document.documentElement.dataset.mirrorReady) return;
          var shell=document.getElementById('mirror-preboot');
          var text=document.getElementById('mirror-preboot-text');
          if(shell) shell.classList.add('failed');
          if(text) text.textContent='启动时间过长，可能是旧缓存或系统 WebView 兼容问题。点击下方按钮自动修复后重启。';
        },8000);
        window.__mirrorBootComplete=function(){
          window.clearTimeout(failTimer);
          document.documentElement.dataset.mirrorReady='1';
        };
        window.__mirrorNativeRecover=async function(){
          try{
            if('serviceWorker' in navigator){
              var regs=await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function(reg){return reg.unregister();}));
            }
            if('caches' in window){
              var keys=await caches.keys();
              await Promise.all(keys.map(function(key){return caches.delete(key);}));
            }
          }catch(e){}
          try{
            Object.keys(localStorage).filter(function(key){return key.indexOf('mirror-isle:')===0;}).forEach(function(key){localStorage.removeItem(key);});
          }catch(e){}
          location.reload();
        };
        window.addEventListener('error',function(){
          var shell=document.getElementById('mirror-preboot');
          var text=document.getElementById('mirror-preboot-text');
          if(shell) shell.classList.add('failed');
          if(text) text.textContent='启动组件加载失败。可以自动清理旧缓存后重启。';
        });
        window.addEventListener('unhandledrejection',function(){
          var shell=document.getElementById('mirror-preboot');
          var text=document.getElementById('mirror-preboot-text');
          if(shell) shell.classList.add('failed');
          if(text) text.textContent='启动组件出现异常。可以自动清理旧缓存后重启。';
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main id="mirror-preboot">
        <section class="box">
          <h1>镜屿</h1>
          <p id="mirror-preboot-text">正在进入镜屿…</p>
          <button type="button" onclick="window.__mirrorNativeRecover && window.__mirrorNativeRecover()">自动修复并重启</button>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
